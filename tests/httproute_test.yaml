suite: HTTPRoute
release:
  name: prowlarr
templates:
  - templates/httproute.yaml
tests:
  - it: is off by default
    asserts:
      - hasDocuments:
          count: 0

  - it: routes the hostnames to Prowlarr's Service
    set:
      httpRoute.enabled: true
      httpRoute.parentRefs:
        - name: gateway
          namespace: gateway-system
      httpRoute.hostnames: [prowlarr.example.com]
    asserts:
      - equal:
          path: spec
          value:
            parentRefs:
              - name: gateway
                namespace: gateway-system
            hostnames: [prowlarr.example.com]
            rules:
              - backendRefs:
                  - name: prowlarr
                    port: 9696

  - it: fails without a parent
    set:
      httpRoute.enabled: true
    asserts:
      - failedTemplate:
          errorMessage: httpRoute.parentRefs is required when httpRoute is enabled
