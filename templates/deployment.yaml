apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "prowlarr.labels" . | nindent 4 }}
spec:
  # Two copies of Prowlarr can't share one database, so the old pod stops before the new one starts.
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      {{- include "prowlarr.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "prowlarr.podLabels" . | nindent 8 }}
    spec:
      enableServiceLinks: false
      automountServiceAccountToken: false
      # The image's non-root mode: PUID and PGID do nothing, and /config must already be writable by this user.
      securityContext:
        runAsNonRoot: true
        runAsUser: {{ .Values.uid }}
        runAsGroup: {{ .Values.gid }}
        fsGroup: {{ .Values.gid }}
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: prowlarr
          image: "lscr.io/linuxserver/prowlarr:{{ .Values.image.tag | default .Chart.AppVersion }}"
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
          env:
            - name: TZ
              value: {{ .Values.timezone | quote }}
            - name: PROWLARR__AUTH__APIKEY
              valueFrom:
                {{- include "prowlarr.secretKeyRef" (list "apiKey" .Values.apiKey) | nindent 16 }}
            # Spelled exactly so: Prowlarr parses enum values case-sensitively.
            - name: PROWLARR__AUTH__METHOD
              value: Forms
            - name: PROWLARR__AUTH__REQUIRED
              value: Enabled
            - name: PROWLARR__POSTGRES__HOST
              value: {{ required "postgres.host is required" .Values.postgres.host | quote }}
            - name: PROWLARR__POSTGRES__PORT
              value: {{ .Values.postgres.port | quote }}
            - name: PROWLARR__POSTGRES__MAINDB
              value: {{ .Values.postgres.databases.main | quote }}
            - name: PROWLARR__POSTGRES__LOGDB
              value: {{ .Values.postgres.databases.log | quote }}
            - name: PROWLARR__POSTGRES__USER
              valueFrom:
                {{- include "prowlarr.secretKeyRef" (list "postgres.username" .Values.postgres.username) | nindent 16 }}
            - name: PROWLARR__POSTGRES__PASSWORD
              valueFrom:
                {{- include "prowlarr.secretKeyRef" (list "postgres.password" .Values.postgres.password) | nindent 16 }}
          ports:
            - name: http
              containerPort: 9696
          startupProbe:
            httpGet:
              path: /ping
              port: http
            periodSeconds: 10
            failureThreshold: 30
          livenessProbe:
            httpGet:
              path: /ping
              port: http
            periodSeconds: 30
          readinessProbe:
            httpGet:
              path: /ping
              port: http
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          volumeMounts:
            - name: config
              mountPath: /config
            - name: run
              mountPath: /run
      volumes:
        - name: config
          persistentVolumeClaim:
            claimName: {{ required "persistence.config.existingClaim is required" .Values.persistence.config.existingClaim }}
        - name: run
          emptyDir: {}
